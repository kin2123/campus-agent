name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install sqlalchemy pydantic pydantic-settings
      - name: Compile
        run: python -m compileall -q app tests
      - name: Run unittest
        run: python -m unittest discover -s tests -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  chain-e2e:
    name: Full chain (backend + MCP + fake model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Build knowledge index
        run: python scripts/build_index.py --rebuild
      - name: Start services and run chain checks
        run: |
          mkdir -p logs
          (cd backend && exec python -m app.main > ../logs/backend.log 2>&1) &
          BACKEND_PID=$!
          python -m mcp_server.server > logs/mcp.log 2>&1 &
          MCP_PID=$!

          cleanup() {
            kill "$BACKEND_PID" "$MCP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18000/health >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18000/health

          for i in $(seq 1 60); do
            if python -c "import socket; s=socket.create_connection(('127.0.0.1',18001),1); s.close()" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          python -c "import socket; s=socket.create_connection(('127.0.0.1',18001),1); s.close(); print('MCP 18001 ready')"

          set +e
          python scripts/check_chain.py
          STATUS=$?
          set -e

          echo "===== backend log ====="
          tail -200 logs/backend.log || true
          echo "===== mcp log ====="
          tail -200 logs/mcp.log || true
          exit "$STATUS"
